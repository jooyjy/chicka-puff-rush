<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ef3734">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="darkreader-lock">
<title>Chicka Catch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Brand palette only: Chika Red, Chika Yellow + logo black/white */
  :root{ color-scheme:light dark; --red:#ef3734; --yellow:#fdcd0b; --black:#000; --white:#fff; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Poppins',system-ui,sans-serif;color:var(--black);background:var(--red);
    min-height:100dvh;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;padding:16px 16px 24px;}

  .spots{position:absolute;inset:0;z-index:0;opacity:.12;
    background-image:
      radial-gradient(ellipse 9px 7px at 20px 25px,#000 98%,transparent),
      radial-gradient(ellipse 6px 8px at 62px 70px,#000 98%,transparent),
      radial-gradient(ellipse 8px 6px at 95px 18px,#000 98%,transparent),
      radial-gradient(ellipse 5px 6px at 40px 100px,#000 98%,transparent);
    background-size:120px 120px;}
  .burst{position:absolute;z-index:0;width:1000px;height:1000px;left:50%;top:32%;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,var(--yellow) 0 9deg,transparent 9deg 18deg);
    opacity:.25;border-radius:50%;animation:spin 40s linear infinite;
    -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  /* real falling puffs */
  .puffs{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .puff{position:absolute;top:-120px;width:60px;height:auto;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:fall linear infinite}
  @keyframes fall{
    from{transform:translateY(0) rotate(var(--r0)) scaleX(var(--fx))}
    to{transform:translateY(calc(100dvh + 240px)) rotate(var(--r1)) scaleX(var(--fx))}}

  /* pile peeking from bottom */
  .pile{position:absolute;z-index:1;bottom:-70px;left:50%;width:min(340px,80vw);
    transform:translateX(-50%);filter:drop-shadow(0 -6px 12px rgba(0,0,0,.25));
    animation:rise 0.9s .55s cubic-bezier(.2,1.4,.4,1) both;pointer-events:none}

  .wrap{position:relative;z-index:2;width:100%;max-width:400px;text-align:center}

  .hero{position:relative;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
  .mascot{width:min(132px,32vw);margin-right:-18px;position:relative;z-index:2;
    filter:drop-shadow(0 10px 10px rgba(0,0,0,.35));
    animation:bob 2.4s ease-in-out infinite;transform-origin:bottom center}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
  .logo{width:min(310px,80vw);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;
    filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}

  .tag{font-family:'Poppins',Helvetica,sans-serif;font-weight:900;font-size:clamp(44px,14vw,58px);letter-spacing:-.5px;line-height:1;
    text-transform:uppercase;color:var(--yellow);-webkit-text-stroke:7px var(--black);paint-order:stroke fill;
    text-shadow:4px 5px 0 var(--black);margin-top:14px;transform:rotate(-4deg);display:inline-block;
    animation:pop .7s .12s cubic-bezier(.2,1.6,.4,1) both;}
  .pill{display:inline-block;margin:14px 0 22px;padding:7px 16px;border-radius:999px;
    background:var(--black);color:var(--white);font-weight:600;font-size:14px;
    animation:pop .6s .22s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}}

  .opts{display:grid;gap:18px}
  .btn{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;
    padding:12px 16px;border-radius:22px;border:4px solid var(--black);text-align:left;color:var(--black);
    box-shadow:0 8px 0 var(--black);transition:transform .1s, box-shadow .1s;
    animation:rise .6s cubic-bezier(.2,1.4,.4,1) both;}
  .btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--black)}
  .btn.snap{background:var(--yellow);animation-delay:.35s}
  .btn.web{background:var(--white);animation-delay:.47s}
  @keyframes rise{from{opacity:0;transform:translate(var(--tx,0),60px)}}
  .pile{--tx:-50%}
  .btn .ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--black)}
  .btn .ic svg{width:30px;height:30px}
  .snap .ic svg{fill:var(--white);stroke:var(--black);stroke-width:.6}
  .web .ic svg{fill:none;stroke:var(--yellow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .btn .t{font-family:'Poppins',Helvetica,sans-serif;font-weight:800;font-size:21px;line-height:1.15;display:block;letter-spacing:-.2px}
  .btn .s{font-size:13px;font-weight:500;display:block;margin-top:2px}
  .btn .go{margin-left:auto;width:38px;height:38px;flex:none;border-radius:50%;background:var(--black);
    display:grid;place-items:center;transition:transform .2s}
  .btn .go svg{width:20px;height:20px;fill:none;stroke:var(--white);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .btn:hover .go{transform:translateX(3px)}
  .snap::before{content:"HOT!";position:absolute;top:-14px;right:14px;font-family:'Poppins',Helvetica,sans-serif;
    font-size:11px;font-weight:800;letter-spacing:1px;background:var(--red);color:var(--white);padding:2px 10px;border-radius:999px;
    border:3px solid var(--black);transform:rotate(6deg);animation:wiggle 1.6s ease-in-out infinite}
  @keyframes wiggle{50%{transform:rotate(-6deg) scale(1.1)}}

  @media (max-height:700px){ .mascot{width:100px} .logo{width:200px} .pill{margin:10px 0 16px} .pile{width:260px;bottom:-80px} }
  .powered{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:8px 14px 8px 16px;
    background:var(--white);border:3px solid var(--black);border-radius:16px;box-shadow:0 5px 0 var(--black);
    text-decoration:none;color:var(--black);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    animation:rise .6s .6s cubic-bezier(.2,1.4,.4,1) both}
  .powered img{height:44px;width:auto;display:block}
  html{background:#ef3734}
  html,body,*{forced-color-adjust:none}
  /* Same look in dark mode: declaring dark support stops Chrome/Samsung auto-darkening */
  @media (prefers-color-scheme: dark){
    :root{ --red:#ef3734; --yellow:#fdcd0b; --black:#000; --white:#fff; }
    html,body{background:#ef3734}
  }
  img{filter:none}
</style>
</head>

  }
